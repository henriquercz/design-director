interface:
  display_name: "Design Director"
  short_description: "Routes UI/UX work from abstract intent to verified implementation"
  default_prompt: "Use $design-director to inspect the interface and its real design-system evidence, infer the right design treatment(s), reuse current project primitives/APIs where appropriate, preserve product truth, implement complete states/contracts, and verify the rendered result. The user does not need to name internal modes."
